# Self-hosted stack: the Next server plus the MariaDB it stores everything in.
#
# Both services are needed — unlike the file-backed database this replaced, the
# app cannot start a database of its own. `docker compose up` is the supported
# way to run it; a bare `docker run` of the app image needs a reachable
# DATABASE_URL supplied by hand.

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: hevy_planner
      MARIADB_USER: hevy
      # Compose substitutes these from .env (never committed). The defaults keep
      # a local try-it-out working; a deployment must set real values.
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-hevy}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    # No `ports:` on purpose — the database is reachable only from the compose
    # network. Publishing 3306 to the host is what turns a home server into an
    # internet-exposed database.
    healthcheck:
      # healthcheck.sh ships with the mariadb image; --connect proves the server
      # is accepting connections, not merely that the process exists.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://hevy:${MARIADB_PASSWORD:-hevy}@db:3306/hevy_planner
      # The TRAINEE's timezone, and it is not cosmetic. Hevy stores workout times
      # as UTC instants, every date on the records, routines and profile screens
      # is rendered on the SERVER, and a container with no TZ is UTC. So a
      # session logged at 07:00 in Tokyo printed as the previous day, and
      # "today"/"yesterday" was computed against the wrong midnight.
      # UTC is the honest default for an unconfigured deployment; set TZ in .env
      # to an IANA name (Europe/Berlin, America/New_York) to fix the labels.
      TZ: ${TZ:-UTC}
      # Encrypts the stored Hevy key at rest. Deliberately has NO default: an
      # empty value means plaintext in the database volume and in every dump
      # taken from it, and a shared fallback secret would be worse than none.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?set SETTINGS_ENCRYPTION_KEY in .env - see .env.example}
      # Authentication. Required, and required LOUDLY: `:?` fails `compose up`
      # with this message rather than starting a container that would answer
      # every request with a 503 nobody reads. The app refuses to serve without
      # it because it holds a Hevy key and can write undeletable routines.
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?set AUTH_SESSION_SECRET in .env - see .env.example}
      # Google sign-in (recommended). Empty here selects the Hevy-key gate.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_ORIGIN: ${AUTH_ORIGIN:-}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      # Hevy-key gate (fallback; a shared-secret password gate, not identity).
      AUTH_ALLOWED_HEVY_USER_IDS: ${AUTH_ALLOWED_HEVY_USER_IDS:-}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-}
      # Deliberately NOT passed through: AUTH_DISABLED. A container built from
      # this file runs with NODE_ENV=production, which refuses it anyway —
      # forwarding it would only invite someone to try.
      # Optional bootstrap key; the settings page is the normal way to set it.
      HEVY_API_KEY: ${HEVY_API_KEY:-}
      # Plan generation. All optional — with no LLM_API_KEY the app falls back to
      # the deterministic generator, silently, so a missing passthrough here
      # looks exactly like a working container producing worse plans.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_THINKING: ${LLM_THINKING:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
    ports:
      # Host port only; the server always listens on 3000 inside the container
      # (Dockerfile PORT). Override with APP_PORT when 3000 is already taken on
      # the host — a dev server on 3000 makes `compose up` fail on the bind.
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data:
